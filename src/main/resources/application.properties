spring.application.name=demo
# Configurazione porta server springboot
server.port=8081

# ATTENZIONE: in base al tipo di database cheh hai, seleziona il driver corrispondente
# SE HAI MYSQL -> decommenta la riga che contiene com.mysql.cj.jdbc.Driver
# SE HAI MARIADB -> decommenta la riga che contiene org.mariadb.jdbc.Driver
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configurazione Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Dati di connessione al database
# Nella stringa di connessione qui sotto usa jdbc:mariadb SE HAI MARIADB come database installato in locale
# Altrimenti usa jdbc:mysql se hai MYSQL installato in locale
# NON VA? Prova a cambiare la tipologia di driver oppure cambia 127.0.0.1 in localhost o viceversa
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/demo_db
spring.datasource.username=root
spring.datasource.password=

# dico a Hinermate di creare e aggiornare le tabelle in automatico
spring.jpa.hibernate.ddl-auto=update

# mostro le query SQL in console per capire cosa succede
spring.jpa.show-sql=true

# JWT
app.jwt.secret=Y2hhbmdlLXRoaXMtdG8tYS1zZWN1cmUtMjU2LWJpdC1rZXktdGhhdC1pcy1hdC1sZWFzdC02NC1jaGFycw==
app.jwt.expiration=86400000

# Cookie Configuration
app.cookie.name=auth_token
app.cookie.path=/
app.cookie.secure=false

         # true in produzione con HTTPS
app.cookie.http-only=true
app.cookie.same-site=Lax
         # Strict o Lax; None richiede Secure=true
app.cookie.max-age=86400
         # 24 ore in secondi

app.jwt.refresh-expiration=604800000
app.cookie.refresh-name=refresh_token
app.cookie.refresh-path=/api/auth/refresh
app.cookie.refresh-max-age=604800
app.cookie.refresh-secure=false
  # true in produzione